name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/wingstats
  SCOREBIRD_IMAGE: ghcr.io/${{ github.repository_owner }}/wingstats-scorebird

permissions:
  contents: read
  packages: write  # Required for GHCR

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-app:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push main app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: build-image
        run: echo "image=${{ env.APP_IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  build-scorebird:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scorebird image
        uses: docker/build-push-action@v6
        with:
          context: ./scorebird-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.SCOREBIRD_IMAGE }}:${{ github.sha }}
            ${{ env.SCOREBIRD_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: build-image
        run: echo "image=${{ env.SCOREBIRD_IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: [build-app, build-scorebird]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy config files to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "scorebird-service/players.json,deploy/docker-compose.yml,deploy/Caddyfile"
          target: "~/wingstats/"
          strip_components: 1

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ needs.build-app.outputs.image }}
          SCOREBIRD_IMAGE: ${{ needs.build-scorebird.outputs.image }}
          REGISTRY: ${{ env.REGISTRY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: APP_IMAGE,SCOREBIRD_IMAGE,REGISTRY,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,DOMAIN,DISCORD_BOT_TOKEN,GIPHY_API_KEY,GITHUB_ACTOR,GITHUB_TOKEN
          script_stop: true
          script: |
            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login $REGISTRY -u $GITHUB_ACTOR --password-stdin

            cd ~/wingstats

            # Prune unused images and build cache to free up space
            docker system prune -af

            # Pull latest images
            docker pull $APP_IMAGE
            docker pull $SCOREBIRD_IMAGE

            # Write .env
            cat > .env <<EOF
            APP_IMAGE=$APP_IMAGE
            SCOREBIRD_IMAGE=$SCOREBIRD_IMAGE
            AWS_REGION=$AWS_REGION
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            DOMAIN=$DOMAIN
            DISCORD_BOT_TOKEN=$DISCORD_BOT_TOKEN
            GIPHY_API_KEY=$GIPHY_API_KEY
            EOF

            # Restart services
            docker compose down
            docker compose up -d
